global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

api:
  dashboard: false
  debug: false

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true

certificatesResolvers:
  acme:
    acme:
      # 使用 acme.sh 半自动签发后挂载的场景下，可将此 certresolver 作为 fallback；
      # 用户偏好：公网不稳定 → 使用 acme.sh 手动/半自动签发 + 挂载。
      # storage: "/acme/acme.json"
      # httpChallenge:
      #   entryPoint: "web"
      tlsChallenge: {}
